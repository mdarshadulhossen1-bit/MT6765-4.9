name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install Build Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y bc build-essential bison flex libssl-dev git wget libelf-dev gcc-aarch64-linux-gnu make

    - name: Setup MemKernel Driver Source (Video Method)
      run: |
        git clone https://github.com/aiichi/MemKernel.git drivers/memkernel
        if [ -d "drivers/memkernel" ]; then
          echo "obj-\$(CONFIG_MEMKERNEL) += memkernel/" >> drivers/Makefile
          echo "source \"drivers/memkernel/Kconfig\"" >> drivers/Kconfig
        fi

    - name: Build Kernel and Loadable Module (.ko)
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export PATH="/usr/bin:$PATH"
        
        make 2e_defconfig
        make -j$(nproc) modules
        make -j$(nproc) Image.gz

    - name: Upload Kernel and Module Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-and-modules
        path: |
          **/*.ko
          arch/arm64/boot/Image.gz
